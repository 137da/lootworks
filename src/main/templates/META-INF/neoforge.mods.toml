modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/137da/lootworks/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://modrinth.com/mod/lootworks"
logoFile="lootworks_logo.png"
logoBlur=false
authors="137da"
description='''
Probe structure loot chest probabilities, crack unlooted chests for Treasure Cores & Relic Metal, and rewrite chest fate with crystals and catalysts.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="lootr"
    type="optional"
    versionRange="[1.10,)"
    ordering="NONE"
    side="BOTH"
